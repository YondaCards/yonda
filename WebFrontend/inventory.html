<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yonda — Учет товаров</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script>
    function todayIso() {
      var d = new Date();
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + mm + '-' + dd;
    }

    var ACTION_TITLES = { inventory: 'Инвентаризация', production: 'Производство', writeoff: 'Списание', transfer: 'Перемещение' };
    var ACTION_QTY_LABELS = { production: 'Произведено', writeoff: 'Списано', transfer: 'Переместить' };
    function initialState() {
      return { screen: 'action', action: null, type: null, location: null, from: '', to: '', locations: null, items: null, facts: {}, customItems: [], changes: [], written: 0, isSaleReconciliation: false, saleReconciliationDate: todayIso() };
    }
    var state = initialState();

    function render() {
      var app = document.getElementById('app');
      if (state.screen === 'action') { app.innerHTML = renderAction(); bindAction(); return; }
      if (state.screen === 'transferpick') { app.innerHTML = renderTransferPick(); bindTransferPick(); return; }
      if (state.screen === 'moveitems') { app.innerHTML = renderMoveItems(); bindMoveItems(); return; }
      if (state.screen === 'type') { app.innerHTML = renderType(); bindType(); return; }
      if (state.screen === 'location') { app.innerHTML = renderLocation(); bindLocation(); return; }
      if (state.screen === 'counting') { app.innerHTML = renderCounting(); bindCounting(); return; }
      if (state.screen === 'confirm') { app.innerHTML = renderConfirm(); bindConfirm(); return; }
    }

    function renderAction() {
      var order = ['inventory', 'production', 'writeoff', 'transfer'];
      var hints = { inventory: 'Сверить фактические остатки', production: 'Приход произведённых товаров', writeoff: 'Списание (продажа) со склада', transfer: 'Между складами' };
      var btns = '';
      order.forEach(function (a) {
        btns += '<button class="card-btn" data-action="' + a + '"><div style="flex:1;"><div style="font-size:16px;font-weight:700;">' + ACTION_TITLES[a] + '</div>' +
          '<div style="font-size:13px;color:oklch(0.55 0.01 250);">' + hints[a] + '</div></div></button>';
      });
      return '<div class="screen" style="padding:28px 20px 24px;gap:28px;">' +
        '<div><div style="font-size:12.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:oklch(0.55 0.01 250);">Yonda · Учет товаров</div>' +
        '<div style="font-size:23px;font-weight:800;">Что делаем?</div></div>' +
        '<div style="display:flex;flex-direction:column;gap:12px;">' + btns + '</div></div>';
    }

    function bindAction() {
      document.querySelectorAll('[data-action]').forEach(function (btn) {
        btn.onclick = function () {
          var a = btn.getAttribute('data-action');
          state = initialState(); state.action = a;
          if (a === 'inventory') { state.screen = 'type'; render(); return; }
          state.screen = a === 'transfer' ? 'transferpick' : 'location';
          state.locations = null; render();
          apiGetCached('getLocations', {}, 'yonda_ref_locations').then(function (locations) { state.locations = locations; render(); }).catch(onError);
        };
      });
    }

    function loadMovementItems(loc) {
      state.items = null; state.facts = {}; state.screen = 'moveitems'; render();
      apiGet('getProductsSnapshot', { location: loc }).then(function (items) { state.items = items; render(); }).catch(onError);
    }

    function renderTransferPick() {
      var header = '<div class="header"><button class="back-btn" id="back-to-action">' + backIcon() + '</button><div class="title">Перемещение</div></div>';
      if (state.locations === null) return '<div class="screen">' + header + '<div class="spinner">Загрузка…</div></div>';
      function opts(sel) {
        var o = '<option value="">— выберите —</option>';
        state.locations.forEach(function (l) { o += '<option value="' + escapeAttr(l) + '"' + (l === sel ? ' selected' : '') + '>' + escapeHtml(l) + '</option>'; });
        return o;
      }
      return '<div class="screen">' + header +
        '<div class="list" style="gap:14px;padding:16px 20px;">' +
          '<label style="font-size:13px;font-weight:600;">Откуда</label><select id="transfer-from" class="name-input">' + opts(state.from) + '</select>' +
          '<label style="font-size:13px;font-weight:600;">Куда</label><select id="transfer-to" class="name-input">' + opts(state.to) + '</select>' +
        '</div>' +
        '<div class="footer"><button class="primary-btn" id="transfer-next">Далее</button></div></div>';
    }

    function bindTransferPick() {
      document.getElementById('back-to-action').onclick = function () { state = initialState(); render(); };
      if (state.locations === null) return;
      document.getElementById('transfer-from').onchange = function (e) { state.from = e.target.value; };
      document.getElementById('transfer-to').onchange = function (e) { state.to = e.target.value; };
      document.getElementById('transfer-next').onclick = function () {
        if (!state.from || !state.to) { alert('Выберите склады «Откуда» и «Куда»'); return; }
        if (state.from === state.to) { alert('Склады «Откуда» и «Куда» должны различаться'); return; }
        loadMovementItems(state.from);
      };
    }

    function renderMoveItems() {
      var subtitle = state.action === 'transfer' ? (state.from + ' → ' + state.to) : state.location;
      var header = '<div class="header"><button class="back-btn" id="back-from-move">' + backIcon() + '</button><div><div class="title">' + ACTION_TITLES[state.action] + '</div><div class="subtitle">' + escapeHtml(subtitle) + '</div></div></div>';
      if (state.items === null) return '<div class="screen">' + header + '<div class="spinner">Загрузка…</div></div>';
      var rows = '';
      state.items.forEach(function (item) {
        var q = state.facts[item.name] === undefined ? '' : state.facts[item.name];
        rows += '<div class="row"><div style="flex:1;"><div class="row-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="row-stock">Сейчас: ' + escapeHtml(String(item.current)) + '</div></div>' +
          '<input class="fact-input" type="number" inputmode="decimal" min="0" placeholder="—" data-qty="' + escapeAttr(item.name) + '" value="' + escapeAttr(q) + '"></div>';
      });
      return '<div class="screen">' + header + '<div style="padding:8px 20px 0;font-size:13px;color:oklch(0.55 0.01 250);">' + ACTION_QTY_LABELS[state.action] + ' (количество):</div>' +
        '<div class="list">' + rows + '</div>' +
        '<div class="footer"><button class="primary-btn" id="save-move">Сохранить</button></div></div>';
    }

    function bindMoveItems() {
      document.getElementById('back-from-move').onclick = function () {
        state.items = null; state.facts = {};
        state.screen = state.action === 'transfer' ? 'transferpick' : 'location'; render();
      };
      if (state.items === null) return;
      document.querySelectorAll('[data-qty]').forEach(function (el) {
        el.onchange = function () { state.facts[el.getAttribute('data-qty')] = el.value; };
      });
      document.getElementById('save-move').onclick = onSaveMovement;
    }

    function onSaveMovement() {
      var items = [];
      state.items.forEach(function (item) {
        var raw = state.facts[item.name];
        if (raw === undefined || raw === '' || isNaN(Number(raw)) || Number(raw) <= 0) return;
        items.push({ name: item.name, quantity: raw });
      });
      if (items.length === 0) { alert('Введите количество хотя бы для одного товара'); return; }
      state.changes = items.map(function (i) { return { name: i.name, label: (state.action === 'writeoff' ? '−' : '+') + i.quantity }; });
      var btn = document.getElementById('save-move');
      btn.setAttribute('disabled', 'true'); btn.textContent = 'Сохраняем…';
      apiPost('submitStockMovement', { movement: state.action, location: state.location || '', from: state.from, to: state.to, items: items })
        .then(function (result) {
          state.written = result && typeof result.written === 'number' ? result.written : items.length;
          state.screen = 'confirm'; render();
        })
        .catch(function (err) { btn.removeAttribute('disabled'); btn.textContent = 'Сохранить'; onError(err); });
    }

    function renderType() {
      return '' +
        '<div class="screen" style="padding:28px 20px 24px;gap:28px;">' +
          '<div><div style="font-size:12.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:oklch(0.55 0.01 250);">Yonda · Инвентаризация</div>' +
          '<div style="font-size:23px;font-weight:800;">Что считаем?</div></div>' +
          '<button class="back-btn" id="back-to-action" style="align-self:flex-start;">' + backIcon() + '</button>' +
          '<div style="display:flex;flex-direction:column;gap:12px;">' +
            '<button class="card-btn" id="pick-materials"><div style="flex:1;"><div style="font-size:16px;font-weight:700;">Материалы</div>' +
            '<div style="font-size:13px;color:oklch(0.55 0.01 250);">Склад материалов</div></div></button>' +
            '<button class="card-btn" id="pick-products"><div style="flex:1;"><div style="font-size:16px;font-weight:700;">Товары</div>' +
            '<div style="font-size:13px;color:oklch(0.55 0.01 250);">Основной склад и точки продаж</div></div></button>' +
          '</div>' +
        '</div>';
    }

    function bindType() {
      document.getElementById('back-to-action').onclick = function () { state = initialState(); render(); };
      document.getElementById('pick-materials').onclick = function () {
        state.type = 'materials'; state.facts = {}; state.customItems = [];
        state.screen = 'counting'; state.items = null; render();
        apiGet('getMaterialsSnapshot', {}).then(function (items) { state.items = items; render(); }).catch(onError);
      };
      document.getElementById('pick-products').onclick = function () {
        state.type = 'products'; state.facts = {}; state.customItems = [];
        state.screen = 'location'; state.locations = null; render();
        apiGetCached('getLocations', {}, 'yonda_ref_locations').then(function (locations) { state.locations = locations; render(); }).catch(onError);
      };
    }

    function renderLocation() {
      if (state.locations === null) {
        return '<div class="screen"><div class="header"><button class="back-btn" id="back-to-type">' + backIcon() + '</button><div class="title">Выбрать точку</div></div><div class="spinner">Загрузка…</div></div>';
      }
      var rows = '';
      state.locations.forEach(function (loc) {
        rows += '<button class="card-btn" data-loc="' + escapeAttr(loc) + '" style="justify-content:space-between;margin-bottom:10px;"><div style="font-size:15px;font-weight:600;">' + escapeHtml(loc) + '</div></button>';
      });
      return '' +
        '<div class="screen">' +
          '<div class="header"><button class="back-btn" id="back-to-type">' + backIcon() + '</button><div class="title">Выбрать точку</div></div>' +
          '<div class="list">' + rows + '</div>' +
        '</div>';
    }

    function bindLocation() {
      document.getElementById('back-to-type').onclick = function () {
        if (state.action === 'inventory') { state.screen = 'type'; state.type = null; } else { state = initialState(); }
        render();
      };
      if (state.locations === null) return;
      document.querySelectorAll('[data-loc]').forEach(function (btn) {
        btn.onclick = function () {
          state.location = btn.getAttribute('data-loc');
          if (state.action !== 'inventory') { loadMovementItems(state.location); return; }
          state.facts = {}; state.customItems = [];
          state.screen = 'counting'; state.items = null; render();
          apiGet('getProductsSnapshot', { location: state.location }).then(function (items) { state.items = items; render(); }).catch(onError);
        };
      });
    }

    function renderCounting() {
      if (state.items === null) {
        return '<div class="screen"><div class="header"><button class="back-btn" id="back-from-counting">' + backIcon() + '</button><div><div class="title">' + (state.type === 'materials' ? 'Материалы' : 'Товары') + '</div></div></div><div class="spinner">Загрузка…</div></div>';
      }
      var rows = '';
      state.items.forEach(function (item) {
        var fact = state.facts[item.name] === undefined ? '' : state.facts[item.name];
        var stockLabel = 'Сейчас: ' + escapeHtml(String(item.current)) + (item.unit ? (' ' + escapeHtml(item.unit)) : '');
        rows += '<div class="row"><div style="flex:1;"><div class="row-name">' + escapeHtml(item.name) + '</div>' +
          '<div class="row-stock">' + stockLabel + '</div></div>' +
          '<input class="fact-input" type="number" inputmode="decimal" placeholder="—" data-fact="' + escapeAttr(item.name) + '" value="' + escapeAttr(fact) + '"></div>';
      });
      state.customItems.forEach(function (ci) {
        rows += '<div class="row"><input class="name-input" type="text" placeholder="Название позиции" data-custom-name="' + ci.id + '" value="' + escapeAttr(ci.name) + '">' +
          '<input class="fact-input" style="width:64px;" type="number" inputmode="decimal" placeholder="—" data-custom-fact="' + ci.id + '" value="' + escapeAttr(ci.fact) + '">' +
          '<button class="remove-btn" data-remove-custom="' + ci.id + '">' + removeIcon() + '</button></div>';
      });
      var subtitle = state.type === 'materials' ? 'Основной склад' : state.location;
      var reconciliationToggle = (state.type === 'products' && state.location === 'Основной склад') ?
        '<div style="padding:10px 20px 0;">' +
          '<div class="toggle-row"><label style="font-size:13.5px;font-weight:600;">Это сверка продаж</label>' +
          '<input type="checkbox" id="sale-reconciliation-toggle"' + (state.isSaleReconciliation ? ' checked' : '') + '></div>' +
          (state.isSaleReconciliation ?
            '<div style="display:flex;align-items:center;justify-content:space-between;padding-top:6px;">' +
              '<label style="font-size:13px;color:oklch(0.55 0.01 250);">Дата продаж</label>' +
              '<input type="date" id="sale-reconciliation-date" value="' + escapeAttr(state.saleReconciliationDate) + '">' +
            '</div>' : '') +
        '</div>' : '';
      return '' +
        '<div class="screen">' +
          '<div class="header"><button class="back-btn" id="back-from-counting">' + backIcon() + '</button>' +
          '<div><div class="title">' + (state.type === 'materials' ? 'Материалы' : 'Товары') + '</div><div class="subtitle">' + escapeHtml(subtitle) + '</div></div></div>' +
          reconciliationToggle +
          '<div class="list">' + rows + '<button class="add-row-btn" id="add-custom">' + plusIcon() + ' Добавить позицию</button></div>' +
          '<div class="footer"><button class="primary-btn" id="save-counts">Сохранить</button></div>' +
        '</div>';
    }

    function bindCounting() {
      var backBtn = document.getElementById('back-from-counting');
      if (backBtn) backBtn.onclick = function () {
        if (state.type === 'products') { state.screen = 'location'; }
        else { state.screen = 'type'; state.type = null; }
        render();
      };
      if (state.items === null) return;
      document.querySelectorAll('[data-fact]').forEach(function (el) {
        el.onchange = function () { state.facts[el.getAttribute('data-fact')] = el.value; };
      });
      document.querySelectorAll('[data-custom-name]').forEach(function (el) {
        el.onchange = function () {
          var id = el.getAttribute('data-custom-name');
          state.customItems = state.customItems.map(function (c) { return c.id === id ? Object.assign({}, c, { name: el.value }) : c; });
        };
      });
      document.querySelectorAll('[data-custom-fact]').forEach(function (el) {
        el.onchange = function () {
          var id = el.getAttribute('data-custom-fact');
          state.customItems = state.customItems.map(function (c) { return c.id === id ? Object.assign({}, c, { fact: el.value }) : c; });
        };
      });
      document.querySelectorAll('[data-remove-custom]').forEach(function (el) {
        el.onclick = function () {
          var id = el.getAttribute('data-remove-custom');
          state.customItems = state.customItems.filter(function (c) { return c.id !== id; });
          render();
        };
      });
      document.getElementById('add-custom').onclick = function () {
        state.customItems.push({ id: 'c' + Date.now() + Math.floor(Math.random() * 1000), name: '', fact: '' });
        render();
      };
      var reconciliationToggle = document.getElementById('sale-reconciliation-toggle');
      if (reconciliationToggle) reconciliationToggle.onchange = function () {
        state.isSaleReconciliation = reconciliationToggle.checked;
        render();
      };
      var reconciliationDate = document.getElementById('sale-reconciliation-date');
      if (reconciliationDate) reconciliationDate.onchange = function () { state.saleReconciliationDate = reconciliationDate.value; };
      document.getElementById('save-counts').onclick = onSave;
    }

    function onSave() {
      var counts = [];
      state.items.forEach(function (item) {
        var raw = state.facts[item.name];
        if (raw === undefined || raw === '') return;
        var factNum = Number(raw);
        if (isNaN(factNum)) return;
        var delta = factNum - item.current;
        if (delta === 0) return;
        counts.push({ name: item.name, fact: raw });
      });
      var newItems = state.customItems
        .filter(function (c) { return c.name && c.fact !== '' && !isNaN(Number(c.fact)) && Number(c.fact) !== 0; })
        .map(function (c) { return { name: c.name, fact: c.fact }; });

      state.changes = counts.map(function (c) {
        var item = state.items.filter(function (i) { return i.name === c.name; })[0];
        var delta = Number(c.fact) - item.current;
        var unit = item.unit ? (' ' + item.unit) : '';
        return { name: c.name, label: (delta > 0 ? '+' : '') + delta + unit };
      }).concat(newItems.map(function (ni) {
        return { name: ni.name, label: '+' + ni.fact + ' (новое)' };
      }));

      var btn = document.getElementById('save-counts');
      btn.setAttribute('disabled', 'true');
      btn.textContent = 'Сохраняем…';
      apiPost('submitInventory', { kind: state.type, location: state.location, counts: counts, newItems: newItems, isSaleReconciliation: state.isSaleReconciliation, saleDate: state.saleReconciliationDate })
        .then(function (result) {
          state.written = result && typeof result.written === 'number' ? result.written : state.changes.length;
          state.screen = 'confirm'; render();
        })
        .catch(function (err) {
          btn.removeAttribute('disabled'); btn.textContent = 'Сохранить';
          onError(err);
        });
    }

    function renderConfirm() {
      var rows = '';
      state.changes.forEach(function (chg) {
        rows += '<div class="change-row"><div style="flex:1;font-size:14px;font-weight:600;">' + escapeHtml(chg.name) + '</div>' +
          '<div style="font-size:14px;font-weight:800;color:oklch(0.45 0.14 220);">' + escapeHtml(chg.label) + '</div></div>';
      });
      var summary = (state.written === 0 && state.action === 'inventory') ? 'Расхождений не найдено' : 'Обновлено позиций: ' + state.written;
      return '' +
        '<div class="screen">' +
          '<div style="display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 20px 22px;">' +
            '<div style="width:52px;height:52px;border-radius:50%;background:oklch(0.93 0.05 145);display:flex;align-items:center;justify-content:center;">' + checkIcon() + '</div>' +
            '<div style="font-size:18px;font-weight:800;">' + (state.action === 'inventory' ? 'Инвентаризация сохранена' : ACTION_TITLES[state.action] + ' сохранено') + '</div>' +
            '<div style="font-size:13px;color:oklch(0.55 0.01 250);text-align:center;">' + summary + '</div>' +
          '</div>' +
          '<div class="list" style="gap:8px;">' + rows + '</div>' +
          '<div class="footer" style="border-top:none;"><button class="dark-btn" id="finish">Готово</button></div>' +
        '</div>';
    }

    function bindConfirm() {
      document.getElementById('finish').onclick = function () {
        state = initialState();
        render();
      };
    }

    function onError(err) {
      if (isTokenAuthError(err)) {
        alert('Сессия истекла — войдите заново. Введённые данные будут потеряны.');
        signOut();
        return;
      }
      alert('Ошибка: ' + (err && err.message ? err.message : err));
    }

    function escapeHtml(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
    function backIcon() { return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"></path></svg>'; }
    function plusIcon() { return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg>'; }
    function removeIcon() { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="oklch(0.55 0.18 25)" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"></path></svg>'; }
    function checkIcon() { return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="oklch(0.4 0.14 145)" stroke-width="2.4"><path d="M5 13l4 4L19 7"></path></svg>'; }

    function renderSignedOut() {
      document.getElementById('app').innerHTML = '<div class="signin-wrap"><div style="font-size:16px;font-weight:700;">Войдите, чтобы продолжить</div><div id="signin-button"></div></div>';
    }

    renderSignedOut();
  </script>
  <script src="https://accounts.google.com/gsi/client" async onload="initAuth(render)"></script>
</body>
</html>
